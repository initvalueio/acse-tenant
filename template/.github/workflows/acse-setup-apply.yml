# acse-setup-apply.yml -- template 1.0.0, from initvalueio/acse-tenant (Apache-2.0).
#
# The setup repository's pipeline (spec 02e section 1.1, T-5, T-8). The apply creates the namespace, the promoter's
# OIDC trust, the organization rulesets, the generated config files and the setup roles, and publishes settings/*
# from the merged config/tenant.yaml.
#
# Customer-applied (ADR-0073 Amendment 8, W-9): copy this file unchanged. It holds no tenant value, so it is the same
# file in every setup repository. It reads no repository secret and no repository variable (spec 02e AC-1): cloud
# access is by GitHub OIDC only, and everything tenant-specific is in config/tenant.yaml and your own terraform/
# root (the role names, the state backend, the GitHub Apps' secrets).
#
# Three jobs, three AWS roles, three GitHub credentials (DEC-20, SC-1, SC-5; third round, 2026-11-07):
#   check  pull request. Role acse-setup-check. NO GitHub credential: anyone who can open a pull request can change
#          this file on their branch (SC-5). terraform validate and a plan of the cloud side only (-target on the
#          module's pr_plan_targets; your root must call the module "acse_tenant"). Visibility warnings for gate
#          repositories come from ACSE itself, as a comment on the pull request (GA-4, third round).
#   plan   push to the default branch, no approval gate. Role acse-setup-plan, which reads only your read-only App's
#          key (administration, contents, pull requests and metadata read; no write). The full GitHub and cloud plan
#          goes to the job summary, so reviewers see it before they approve the apply.
#   apply  after plan, in the environment acse-setup-apply (default branch only, required reviewers, no administrator
#          bypass, self-review prevented). Role acse-setup-apply, the only one that can read the setup App's key. It
#          plans again with its own credentials, refuses to apply if that plan differs from the reviewed one, then
#          applies it.
#
# What this file gives your terraform/ root:
#   AWS_WEB_IDENTITY_TOKEN_FILE   a GitHub OIDC token for audience sts.amazonaws.com (for assume_role_with_web_identity
#                                 in your provider and backend)
#   TF_VAR_acse_setup_phase       "check", "plan" or "apply"
#   TF_VAR_setup_commit           the commit being planned or applied (generated_from.commit)
#   terraform init                -backend-config=backend.<phase>.hcl when that file exists in terraform/

name: acse-setup-apply

on:
  pull_request:
    paths:
      - "config/**"
      - "terraform/**"
      - ".github/workflows/acse-setup-apply.yml"
  push:
    paths:
      - "config/**"
      - "terraform/**"
      - ".github/workflows/acse-setup-apply.yml"

permissions:
  contents: read

concurrency:
  group: acse-setup-apply-${{ github.event_name == 'pull_request' && github.ref || 'default-branch' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.16.4"

jobs:
  check:
    name: Check (pull request; cloud side only)
    # Same-repository pull requests only: a fork gets no OIDC token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_acse_setup_phase: check
      TF_VAR_setup_commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: GitHub OIDC token for AWS STS
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/acse-aws-web-identity-token"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -I -c 'import json, sys; v = json.load(sys.stdin)["value"]; print("::add-mask::" + v); open(sys.argv[1], "w").write(v)' "$token_file"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: terraform
        run: |
          set -euo pipefail
          args=()
          if [ -f "backend.${TF_VAR_acse_setup_phase}.hcl" ]; then args+=("-backend-config=backend.${TF_VAR_acse_setup_phase}.hcl"); fi
          terraform init -input=false "${args[@]}"

      - name: terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -diff
          terraform validate

      - name: terraform plan (cloud side only; no GitHub credential)
        working-directory: terraform
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan \
            -target=module.acse_tenant.terraform_data.tenant_config \
            -target=module.acse_tenant.aws_secretsmanager_secret.namespace \
            -target=module.acse_tenant.aws_ssm_parameter.settings_part \
            -target=module.acse_tenant.aws_ssm_parameter.settings \
            -target=module.acse_tenant.aws_iam_openid_connect_provider.github \
            -target=module.acse_tenant.aws_iam_role.promoter \
            -target=module.acse_tenant.aws_iam_role_policy.promoter_reads \
            -target=module.acse_tenant.aws_iam_role.setup_apply \
            -target=module.acse_tenant.aws_iam_role_policy_attachment.setup_apply \
            -target=module.acse_tenant.aws_iam_role.setup_plan \
            -target=module.acse_tenant.aws_iam_role_policy_attachment.setup_plan \
            -target=module.acse_tenant.aws_secretsmanager_secret_policy.setup_plan_credential \
            -target=module.acse_tenant.aws_iam_role.setup_check \
            -target=module.acse_tenant.aws_iam_role_policy_attachment.setup_check \
            -target=module.acse_tenant.aws_secretsmanager_secret_policy.setup_credential

      - name: Summary for reviewers
        run: |
          {
            echo "### ACSE setup: pull request check"
            echo
            echo "This plan covers the cloud side only. The GitHub side (rulesets, generated files, environment) is planned after merge, before the apply is approved."
            echo
            echo "ACSE will comment if any listed repository isn't visible to ACSE Read."
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Plan (default branch; GitHub and cloud; read-only)
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_acse_setup_phase: plan
      TF_VAR_setup_commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: GitHub OIDC token for AWS STS
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/acse-aws-web-identity-token"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -I -c 'import json, sys; v = json.load(sys.stdin)["value"]; print("::add-mask::" + v); open(sys.argv[1], "w").write(v)' "$token_file"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: terraform
        run: |
          set -euo pipefail
          args=()
          if [ -f "backend.${TF_VAR_acse_setup_phase}.hcl" ]; then args+=("-backend-config=backend.${TF_VAR_acse_setup_phase}.hcl"); fi
          terraform init -input=false "${args[@]}"

      - name: terraform plan
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: The plan for reviewers, and its digest for the apply job
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform show -json tfplan > "$RUNNER_TEMP/acse-plan.json"
          mkdir -p "$RUNNER_TEMP/acse-reviewed"
          python3 -I - "$RUNNER_TEMP/acse-plan.json" "$RUNNER_TEMP/acse-reviewed/plan-digest.txt" <<'PY'
          import hashlib, json, sys
          VOLATILE = {"etag"}
          def strip(value):
              if isinstance(value, dict):
                  return {k: strip(v) for k, v in value.items() if k not in VOLATILE}
              if isinstance(value, list):
                  return [strip(v) for v in value]
              return value
          plan = json.load(open(sys.argv[1]))
          rows = sorted(
              json.dumps([rc["address"], rc["change"]["actions"], strip(rc["change"].get("after"))], sort_keys=True)
              for rc in plan.get("resource_changes") or [] if rc["change"]["actions"] != ["no-op"])
          open(sys.argv[2], "w").write("sha256:" + hashlib.sha256("\n".join(rows).encode()).hexdigest() + "\n")
          for check in plan.get("checks") or []:
              if check.get("status") in ("fail", "error"):
                  for instance in check.get("instances") or []:
                      for problem in instance.get("problems") or []:
                          for line in (problem.get("message") or "").splitlines():
                              if line.strip():
                                  print("::warning title=ACSE setup::" + line.replace("%", "%25").replace("\r", "%0D"))
          PY
          rm -f "$RUNNER_TEMP/acse-plan.json"
          {
            echo "### ACSE setup: plan to approve (GitHub and cloud)"
            echo
            echo "Reviewed plan digest: \`$(cat "$RUNNER_TEMP/acse-reviewed/plan-digest.txt")\`. The apply job refuses to apply anything else."
            echo
            echo '<details open><summary>terraform plan</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan | head -c 900000
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acse-reviewed-plan-digest
          path: ${{ runner.temp }}/acse-reviewed/plan-digest.txt
          retention-days: 7

  apply:
    name: Apply (default branch; approval required)
    needs: plan
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: acse-setup-apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_acse_setup_phase: apply
      TF_VAR_setup_commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: GitHub OIDC token for AWS STS
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/acse-aws-web-identity-token"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -I -c 'import json, sys; v = json.load(sys.stdin)["value"]; print("::add-mask::" + v); open(sys.argv[1], "w").write(v)' "$token_file"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: terraform
        run: |
          set -euo pipefail
          args=()
          if [ -f "backend.${TF_VAR_acse_setup_phase}.hcl" ]; then args+=("-backend-config=backend.${TF_VAR_acse_setup_phase}.hcl"); fi
          terraform init -input=false "${args[@]}"

      - name: terraform plan
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acse-reviewed-plan-digest
          path: ${{ runner.temp }}/acse-reviewed

      - name: Refuse anything but the reviewed plan
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform show -json tfplan > "$RUNNER_TEMP/acse-plan.json"
          python3 -I - "$RUNNER_TEMP/acse-plan.json" "$RUNNER_TEMP/acse-reviewed/plan-digest.txt" <<'PY'
          import hashlib, json, sys
          VOLATILE = {"etag"}
          def strip(value):
              if isinstance(value, dict):
                  return {k: strip(v) for k, v in value.items() if k not in VOLATILE}
              if isinstance(value, list):
                  return [strip(v) for v in value]
              return value
          plan = json.load(open(sys.argv[1]))
          rows = sorted(
              json.dumps([rc["address"], rc["change"]["actions"], strip(rc["change"].get("after"))], sort_keys=True)
              for rc in plan.get("resource_changes") or [] if rc["change"]["actions"] != ["no-op"])
          digest = "sha256:" + hashlib.sha256("\n".join(rows).encode()).hexdigest()
          reviewed = open(sys.argv[2]).read().strip()
          if digest != reviewed:
              print(f"::error title=ACSE setup::This plan ({digest}) differs from the reviewed plan ({reviewed}). Nothing was applied. Re-run the workflow so the plan job posts the current plan for review.")
              sys.exit(1)
          print("The plan matches the reviewed plan: " + digest)
          PY
          rm -f "$RUNNER_TEMP/acse-plan.json"

      # The OIDC token is short-lived; take a fresh one for the apply's own sign-in.
      - name: Fresh GitHub OIDC token for AWS STS
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/acse-aws-web-identity-token"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -I -c 'import json, sys; v = json.load(sys.stdin)["value"]; print("::add-mask::" + v); open(sys.argv[1], "w").write(v)' "$token_file"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"

      - name: terraform apply (publishes settings)
        working-directory: terraform
        run: terraform apply -input=false -lock-timeout=5m tfplan
